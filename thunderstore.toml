[config]
schemaVersion = "0.0.1"

[package]
namespace = "DevL0rd"
name = "DesktopBuddy"
versionNumber = "1.1.0"
description = "DesktopBuddy brings your desktop into Resonite with a virtual camera and microphone to integrate your desktop completly and seemlessly into resonite."
websiteUrl = "https://github.com/DevL0rd/DesktopBuddy"
containsNsfwContent = false

[package.dependencies]
ResoniteModding-BepisLoader = "1.6.0"
ResoniteModding-BepisResoniteWrapper = "1.0.2"
Nytra-InterprocessLib = "3.0.0"
ResoniteModding-BepInExRenderer = "5.4.233001"
ResoniteModding-RenderiteHook = "1.1.1"
DevL0rd-DesktopBuddyRuntime = "1.2.0"
[build]
icon = "./icon.png"
readme = "./README_THUNDERSTORE.md"
outdir = "./build"

[[build.copy]]
source = "./DesktopBuddy/bin/Release/net10.0-windows10.0.26100.0/DesktopBuddy.dll"
target = "plugins/DesktopBuddy/"

[[build.copy]]
source = "./DesktopBuddy/bin/Release/net10.0-windows10.0.26100.0/DesktopBuddy.sha"
target = "plugins/DesktopBuddy/"

[[build.copy]]
source = "./icon_transparent.png"
target = "plugins/DesktopBuddy/"

[[build.copy]]
source = "./scripts/CollectDesktopBuddyDiagnostics.ps1"
target = "plugins/DesktopBuddy/"

[[build.copy]]
source = "./DesktopBuddySharedTextureBridge/bin/Release/net472/DesktopBuddySharedTextureBridge.dll"
target = "Renderer/BepInEx/plugins/DesktopBuddySharedTextureBridge/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["resonite"]

[publish.categories]
resonite = ["mods"]
