name: GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SOFTCAM_REPO: DevL0rd/softcam
  SOFTCAM_REF: main

jobs:
  softcam:
    runs-on: windows-latest
    steps:
      - name: Checkout softcam fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOFTCAM_REPO }}
          ref: ${{ env.SOFTCAM_REF }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build softcam (x64 + Win32)
        shell: cmd
        run: |
          nuget restore softcam.sln
          msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Collect softcam DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Pick($platform, $dest) {
            $c = Get-ChildItem -Recurse -Filter 'softcam*.dll' |
              Where-Object { $_.FullName -match "\\$platform\\" -and $_.Name -notmatch 'd\.dll$' } |
              Select-Object -First 1
            if (-not $c) { throw "softcam dll for $platform not found" }
            Copy-Item $c.FullName (Join-Path 'out' $dest)
          }
          Pick 'x64' 'softcam64.dll'
          Pick 'Win32' 'softcam.dll'

      - name: Upload softcam
        uses: actions/upload-artifact@v4
        with:
          name: softcam
          path: out/*.dll

  release:
    needs: softcam
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semantic Major.Minor.Patch for releases. Current value: '$version'" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "name=DesktopBuddy $version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            libpipewire-0.3-dev libxkbcommon-dev libwayland-dev

      - name: Build Windows DLLs and Linux native libraries
        run: ./scripts/build.sh --no-deploy
        env:
          THIRDPARTY_FORCE: "1"

      - name: Download softcam (built from fork on windows-latest)
        uses: actions/download-artifact@v4
        with:
          name: softcam
          path: DesktopBuddyRuntime

      - name: Binary verification manifest
        run: ./scripts/fetch-thirdparty.sh --manifest | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build manual release package
        run: ./scripts/package.sh --package Manual

      - name: Render release notes
        id: notes
        run: |
          version='${{ steps.version.outputs.version }}'
          notes_path="${RUNNER_TEMP}/release-notes.md"
          changelog="$(awk -v ver="$version" '
            /^## / {
              if (started) exit
              h=$0; sub(/^##[[:space:]]+/,"",h); n=length(ver)
              if (substr(h,1,n)==ver) { c=substr(h,n+1,1); if (c=="" || c !~ /[0-9.]/) started=1 }
            }
            started { print }
          ' CHANGELOG.md)"
          if [[ -z "$changelog" ]]; then changelog="$(cat CHANGELOG.md)"; fi
          install="$(awk '
            /^##[[:space:]]+Install([[:space:]]|$)/ { started=1; next }
            started && /^## / { exit }
            started { print }
          ' README.md)"
          if [[ -z "$install" ]]; then
            echo "README.md Install section was not found" >&2
            exit 1
          fi
          {
            printf '## Install\n\n'
            printf '%s\n' "$install" | sed '1{/^[[:space:]]*$/d}'
            printf '\n'
            printf '%s\n' "$changelog"
          } > "$notes_path"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: true
          files: DesktopBuddy-${{ steps.version.outputs.version }}.zip
