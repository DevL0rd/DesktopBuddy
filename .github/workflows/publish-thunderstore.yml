name: Publish Thunderstore

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Thunderstore package(s) to publish'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Runtime
          - Main

concurrency:
  group: publish-thunderstore-${{ github.ref }}
  cancel-in-progress: true

env:
  SOFTCAM_REPO: DevL0rd/softcam
  SOFTCAM_REF: main

jobs:
  softcam:
    runs-on: windows-latest
    steps:
      - name: Checkout softcam fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOFTCAM_REPO }}
          ref: ${{ env.SOFTCAM_REF }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build softcam (x64 + Win32)
        shell: cmd
        run: |
          nuget restore softcam.sln
          msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Collect softcam DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          function Pick($platform, $dest) {
            $c = Get-ChildItem -Recurse -Filter 'softcam*.dll' |
              Where-Object { $_.FullName -match "\\$platform\\" -and $_.Name -notmatch 'd\.dll$' } |
              Select-Object -First 1
            if (-not $c) { throw "softcam dll for $platform not found" }
            Copy-Item $c.FullName (Join-Path 'out' $dest)
          }
          Pick 'x64' 'softcam64.dll'
          Pick 'Win32' 'softcam.dll'

      - name: Upload softcam
        uses: actions/upload-artifact@v4
        with:
          name: softcam
          path: out/*.dll

  publish:
    needs: softcam
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            libpipewire-0.3-dev libxkbcommon-dev libwayland-dev

      - name: Build Windows DLLs and Linux native libraries
        run: ./scripts/build.sh --no-deploy
        env:
          THIRDPARTY_FORCE: "1"

      - name: Download softcam (built from fork on windows-latest)
        uses: actions/download-artifact@v4
        with:
          name: softcam
          path: DesktopBuddyRuntime

      - name: Binary verification manifest
        run: ./scripts/fetch-thirdparty.sh --manifest | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build Thunderstore packages
        run: |
          pkg='${{ github.event.inputs.package }}'
          [[ -z "$pkg" ]] && pkg='All'
          ./scripts/package.sh --package "$pkg"

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [[ -z "${TCLI_AUTH_TOKEN}" ]]; then
            echo "TCLI_AUTH_TOKEN is empty. Add it as a repository secret or to the 'main' environment." >&2
            exit 1
          fi
          dotnet tool restore
          # Publish the runtime package before the main package (main depends on it).
          # Re-publishing an existing version is a no-op (Thunderstore rejects duplicates),
          # so this is safe to run on every push without checking whether the version changed.
          published_any=0
          for zip in build/DevL0rd-DesktopBuddyRuntime-*.zip build/DevL0rd-DesktopBuddy-*.zip; do
            [[ -e "$zip" ]] || continue
            published_any=1
            echo "::group::Publishing $zip"
            if out="$(dotnet tcli publish --file "$zip" --token "$TCLI_AUTH_TOKEN" 2>&1)"; then
              echo "$out"
            else
              echo "$out"
              if grep -q "already exists" <<< "$out"; then
                echo "Skipping; this exact package version already exists on Thunderstore."
              else
                echo "::endgroup::"
                echo "Thunderstore publish failed: $zip" >&2
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
          if [[ "$published_any" -eq 0 ]]; then
            echo "No package zips were produced under build/." >&2
            exit 1
          fi
