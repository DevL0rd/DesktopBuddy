name: Publish Thunderstore

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'RUNTIME_VERSION'
  workflow_dispatch:
    inputs:
      package:
        description: 'Thunderstore package(s) to publish'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Runtime
          - Main

concurrency:
  group: publish-thunderstore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    environment: main
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version file changes
        id: version_changes
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            echo "should_publish=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $before = '${{ github.event.before }}'
          $after = '${{ github.sha }}'
          $changed = @(git diff --name-only $before $after)
          $versionChanged = $changed -contains 'VERSION' -or $changed -contains 'RUNTIME_VERSION'
          echo "should_publish=$($versionChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if (-not $versionChanged) {
            Write-Host "VERSION and RUNTIME_VERSION did not change; skipping Thunderstore publish."
          }

      - uses: actions/setup-dotnet@v4
        if: steps.version_changes.outputs.should_publish == 'true'
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish changed Thunderstore packages
        if: steps.version_changes.outputs.should_publish == 'true'
        shell: pwsh
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          $package = '${{ github.event.inputs.package }}'
          if ([string]::IsNullOrWhiteSpace($package)) {
            $package = 'All'
          }

          ./scripts/deploy-thunderstore.ps1 -Publish -Package $package
